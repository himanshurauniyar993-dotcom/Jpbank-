<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP Bank - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-jp-red { background-color: #B22222; }
        .text-jp-red { color: #B22222; }
        .text-jp-gold { color: #FFD700; }
        .border-jp-red { border-color: #B22222; }
        .focus-ring-jp-red:focus { --tw-ring-color: #B22222; border-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
    
    <!-- Login Container -->
    <div id="login-container" class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300">
        <div class="bg-jp-red p-8 text-center">
            <div class="mx-auto w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-lg">
                <svg class="w-8 h-8 text-jp-red" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">JP Bank</h1>
            <p class="text-jp-gold mt-2 font-medium">Secure Financial Services</p>
        </div>

        <div class="p-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Secure Login</h2>
            
            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Account ID</label>
                    <input type="text" id="accountID" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus-ring-jp-red transition-all outline-none uppercase" placeholder="JPB-101">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Secure PIN</label>
                    <input type="password" id="pin" required maxlength="6" pattern="\d*" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus-ring-jp-red transition-all outline-none tracking-widest" placeholder="••••">
                </div>
                <button type="submit" class="w-full bg-jp-red hover:bg-red-800 text-white font-semibold py-3 rounded-lg shadow-md transition-colors duration-200">
                    Access Account
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Container (Hidden initially) -->
    <div id="dashboard-container" class="hidden max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300">
        <div class="bg-jp-red p-6 text-white flex justify-between items-center">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/></svg>
                <h1 class="text-xl font-bold">JP Bank</h1>
            </div>
            <button id="logout-btn" class="text-sm font-medium hover:text-jp-gold transition-colors">Logout</button>
        </div>
        <div class="p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4" id="welcome-message">Welcome</h2>
            <div class="bg-gray-50 rounded-xl p-6 border border-gray-100 text-center mb-6">
                <p class="text-sm text-gray-500 font-medium mb-1">Available Balance</p>
                <h2 class="text-4xl font-bold text-gray-900">¥<span id="balance-amount">0</span></h2>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
